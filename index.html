<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ethos International School – Student Council Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --ink:#2b1b6b; --ink-soft:#5b4bb0; --card:#ffffff; --card-2:#fff7e6;
  --pink:#ff4fa3; --yellow:#ffd23f; --teal:#19d3c5; --blue:#3a86ff; --purple:#8338ec; --orange:#ff7b2f; --green:#2fd66b;
  --bg1:#7b2ff7; --bg2:#f107a3; --bg3:#ff9a3d; --bg4:#19d3c5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#f3eeff; --ink-soft:#c9bcff; --card:#2a1b5e; --card-2:#3a2683; --bg1:#3a0ca3; --bg2:#7209b7; --bg3:#f72585; --bg4:#4361ee; }
}
:root[data-theme="dark"]{ --ink:#f3eeff; --ink-soft:#c9bcff; --card:#2a1b5e; --card-2:#3a2683; --bg1:#3a0ca3; --bg2:#7209b7; --bg3:#f72585; --bg4:#4361ee; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  color:var(--ink);
  background:#7b2ff7;
  background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));
  background-size:400% 400%;
  animation:bgshift 18s ease infinite;
  min-height:100vh; overflow-x:hidden;
}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* ---------- splash: logo in a circle + loading line ---------- */
#splash{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3),var(--bg4));background-size:300% 300%;animation:bgshift 8s ease infinite;transition:opacity .25s,transform .25s}
#splash.out{opacity:0;transform:scale(1.1);pointer-events:none}
.sp-logo{width:min(48vw,220px);aspect-ratio:1;border-radius:50%;background:#fff;border:8px solid #ffd23f;box-shadow:0 0 0 9px rgba(255,255,255,.35),0 18px 40px rgba(0,0,0,.35);overflow:hidden;animation:beat 1.6s ease-in-out infinite}
.sp-logo img{width:100%;height:100%;object-fit:contain;display:block}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.sp-line{width:min(72vw,340px);height:14px;border-radius:14px;background:rgba(255,255,255,.35);overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.15)}
.sp-line i{display:block;height:100%;width:0;border-radius:14px;background:linear-gradient(90deg,#ffd23f,#ff4fa3,#19d3c5);animation:fillbar .8s cubic-bezier(.5,0,.3,1) forwards}
@keyframes fillbar{to{width:100%}}
.sp-txt{color:#fff;font-weight:700;font-size:1.25rem;text-shadow:0 3px 0 rgba(0,0,0,.2)}

/* ---------- decorations in all four corners ---------- */
.corner{position:fixed;pointer-events:none;z-index:1;font-size:2.2rem;display:flex;flex-direction:column;gap:14px;opacity:.95}
.corner span{display:block;animation:bob 3.2s ease-in-out infinite}
.corner span:nth-child(2){animation-delay:.6s;font-size:1.6rem}
.corner span:nth-child(3){animation-delay:1.2s;font-size:2.6rem}
.tl{top:8px;left:8px}.tr{top:8px;right:8px}.bl{bottom:8px;left:8px}.br{bottom:8px;right:8px}
.tr span,.br span{animation-direction:reverse}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.edge{position:fixed;pointer-events:none;z-index:1;font-size:1.6rem;opacity:.85}
.edge.l{left:6px;top:50%;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateY(-30px) scale(1)}50%{transform:translateY(30px) scale(1.25)}}
.credit{position:fixed;right:12px;bottom:6px;z-index:35;pointer-events:none;white-space:nowrap;font-size:1.7rem;font-weight:700;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
body.voting .credit{bottom:auto;top:8px;right:12px}
.mascot{position:fixed;bottom:10px;z-index:40;font-size:3rem;cursor:pointer;user-select:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));transition:bottom .15s}
.mascot.left{left:64px}.mascot.right{right:64px}
.mascot.wiggle{animation:wiggle .7s}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-25deg) scale(1.2)}40%{transform:rotate(22deg) scale(1.2)}60%{transform:rotate(-14deg)}80%{transform:rotate(10deg)}}
body.voting .mascot{bottom:96px}
.emo{position:fixed;z-index:210;pointer-events:none;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));animation:emoUp var(--d,2.6s) ease-out forwards}
@keyframes emoUp{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0}12%{transform:translate(0,-20px) scale(1.4) rotate(-10deg);opacity:1}100%{transform:translate(var(--dx,0),var(--dy,-260px)) scale(1) rotate(var(--rot,20deg));opacity:0}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}

/* ---------- layout ---------- */
#app{position:relative;z-index:5;max-width:1080px;margin:0 auto;padding:22px 74px 130px}
@media(max-width:640px){#app{padding:16px 46px 140px}.mascot.left{left:44px}.mascot.right{right:44px}.corner{font-size:1.5rem}}
.hero{text-align:center;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18);margin-bottom:18px}
.logo-c{width:118px;height:118px;border-radius:50%;background:#fff;border:6px solid #ffd23f;box-shadow:0 8px 0 rgba(0,0,0,.18),0 0 0 6px rgba(255,255,255,.35);overflow:hidden;margin:0 auto 8px;animation:beat 2.4s ease-in-out infinite}
.logo-c img{width:100%;height:100%;object-fit:contain;display:block}
.hero h1{margin:4px 0 2px;font-size:clamp(1.7rem,5vw,3rem);font-weight:700;letter-spacing:.5px}
.hero p{margin:0;font-size:clamp(1rem,2.6vw,1.3rem);opacity:.95}
.rainbow{background:linear-gradient(90deg,#ffd23f,#ff4fa3,#19d3c5,#3a86ff,#ffd23f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;animation:rb 5s linear infinite}
@keyframes rb{to{background-position:300% 0}}
@keyframes pulse{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.15) rotate(4deg)}}
.card{background:var(--card);border-radius:28px;padding:22px;box-shadow:0 10px 0 rgba(0,0,0,.15),0 24px 40px rgba(0,0,0,.2);animation:pop .16s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;border:0;font:inherit;color:#fff;padding:30px 18px;border-radius:30px;transition:transform .07s;box-shadow:0 10px 0 rgba(0,0,0,.22),0 20px 30px rgba(0,0,0,.2);width:100%}
.big:hover{transform:translateY(-6px) rotate(-1deg)}
.big:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.22)}
.big .ic{font-size:4.4rem;animation:bob 2.6s ease-in-out infinite}
.big h2{margin:0;font-size:1.7rem}
.big small{font-size:1.05rem;opacity:.95}
.big.phone{background:linear-gradient(135deg,#3a86ff,#8338ec)}
.big.pc{background:linear-gradient(135deg,#ff7b2f,#ff4fa3)}
.big.head{background:linear-gradient(135deg,#ffb703,#fb5607)}
.big.dim{filter:grayscale(.6);opacity:.75}
.ybtn.dim{filter:grayscale(.6);opacity:.6}
.btn{font:inherit;font-weight:600;font-size:1.15rem;border:0;border-radius:18px;padding:13px 24px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 6px 0 rgba(0,0,0,.22);transition:transform .07s}
.btn:hover{transform:translateY(-3px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn.ghost{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.7)}
.btn.green{background:linear-gradient(135deg,#19d3c5,#2fd66b)}
.btn.red{background:linear-gradient(135deg,#ff4f5a,#ff7b2f)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.center{text-align:center}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:14px}
#qr{padding:14px;background:#fff;border-radius:22px;border:6px solid var(--purple);box-shadow:0 8px 0 rgba(0,0,0,.15);display:inline-block;animation:beat 3s ease-in-out infinite}
#qr img,#qr canvas{display:block}
.link{word-break:break-all;font-size:.9rem;color:var(--ink-soft);background:var(--card-2);padding:8px 12px;border-radius:12px}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:8px}
.ybtn{border:0;font:inherit;color:#fff;border-radius:26px;padding:22px 10px;cursor:pointer;font-size:1.2rem;font-weight:600;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .07s}
.ybtn b{display:block;font-size:3rem;line-height:1}
.ybtn:hover{transform:translateY(-6px) rotate(-2deg)}.ybtn:active{transform:translateY(4px)}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px}
.tab{font:inherit;font-weight:700;font-size:1.2rem;border:0;border-radius:18px;padding:10px 22px;cursor:pointer;background:var(--card-2);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.15);position:relative;transition:transform .07s}
.tab.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;transform:translateY(-3px) scale(1.06)}
.tab i{position:absolute;top:-9px;right:-7px;background:var(--yellow);color:#4a3200;border-radius:50%;min-width:24px;height:24px;padding:0 4px;font-size:.85rem;display:grid;place-items:center;font-style:normal;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:520px){.cands{grid-template-columns:1fr 1fr;gap:12px}}
.cand{position:relative;border:0;font:inherit;color:var(--ink);background:var(--card-2);border-radius:26px;padding:18px 10px 14px;cursor:pointer;text-align:center;box-shadow:0 7px 0 rgba(0,0,0,.14);transition:transform .07s,box-shadow .07s;animation:pop .16s cubic-bezier(.2,1.4,.4,1) backwards}
.cand:hover{transform:translateY(-6px) rotate(1deg)}
.cand .av{width:86px;height:86px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:2.8rem;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15),0 5px 0 rgba(0,0,0,.12)}
.cand .nm{font-weight:700;font-size:1.08rem;line-height:1.2}
.cand .cl{font-size:.85rem;color:var(--ink-soft);margin-top:2px}
.cand .ck{position:absolute;top:8px;right:10px;width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;font-size:1.4rem;display:none;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.cand.sel{background:linear-gradient(160deg,#fff3a6,#ffd23f);color:#3d2b00;transform:translateY(-8px) scale(1.04);box-shadow:0 0 0 5px var(--green),0 14px 0 rgba(0,0,0,.18)}
.cand.sel .cl{color:#6a4a00}
.cand.sel .ck{display:grid;animation:pop .12s}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);padding:12px 18px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;border-radius:26px 26px 0 0}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.dot{width:26px;height:26px;border-radius:50%;background:var(--card-2);border:3px dashed var(--ink-soft);transition:.1s}
.dot.full{background:var(--green);border:3px solid var(--green);transform:scale(1.2)}
.chip{background:var(--yellow);color:#4a3200;font-weight:600;border-radius:14px;padding:5px 12px;font-size:.95rem;animation:pop .12s}
.locked{text-align:center;padding:34px 20px}
.locked .big-ic{font-size:6rem;animation:pulse 2s infinite}
.locked h2{font-size:2rem;margin:6px 0}
.tools{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px}
.tools button{border:0;background:rgba(255,255,255,.9);color:#2b1b6b;border-radius:50px;font:inherit;font-weight:600;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.tiny{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;z-index:6;font-size:.72rem;color:rgba(255,255,255,.75)}

/* results */
.live{text-align:center;font-weight:700;border-radius:14px;padding:8px 12px;margin-bottom:12px}
.live.on{background:#d9fbe6;color:#0b6b32}.live.off{background:#ffe9cf;color:#8a4700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}
.tile{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border-radius:20px;padding:12px 6px;text-align:center;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tile b{display:block;font-size:2.4rem;line-height:1.1}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.rgrid{grid-template-columns:1fr}}
.rcls{background:var(--card-2);border-radius:22px;padding:12px 14px}
.rcls h3{margin:0 0 6px;font-size:1.3rem}
.rr{display:grid;grid-template-columns:1fr 70px 34px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(128,128,160,.22);font-size:.98rem}
.rr:last-child{border-bottom:0}
.meter{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--teal),var(--blue));min-width:3px;transition:width .25s}
.rr b{text-align:right}

/* head boy / head girl */
.sec{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.22);text-align:center;margin:20px 0 12px;font-size:1.55rem}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.stp{background:rgba(255,255,255,.22);color:#fff;border-radius:18px;padding:10px 4px;text-align:center;font-weight:600;line-height:1.15;border:2px dashed rgba(255,255,255,.6)}
.stp span{font-size:1.8rem;display:block}.stp small{display:block;opacity:.92;font-size:.74rem}
.stp.done{background:#2fd66b;color:#fff;border:2px solid #fff}
.stp.now{background:linear-gradient(135deg,#ffd23f,#ff7b2f);color:#3d2b00;border:2px solid #fff;transform:scale(1.07);animation:pulse2 1.6s infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.7)}50%{box-shadow:0 0 0 12px rgba(255,210,63,0)}}
.stepper.in .stp{background:var(--card-2);color:var(--ink);border-color:var(--ink-soft)}
.stepper.in .stp.done{background:#2fd66b;color:#fff;border:2px solid #2fd66b}
.stepper.in .stp.now{background:linear-gradient(135deg,#ffd23f,#ff7b2f);color:#3d2b00;border:2px solid #fff}
.hlvls{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.hlvl{display:flex;align-items:center;gap:14px;background:var(--card-2);border-radius:18px;padding:12px 16px;text-align:left}
.hlvl-ic{font-size:1.7rem;flex:0 0 auto}
.hlvl.now{box-shadow:0 0 0 3px var(--yellow)}
.hlvl.done{opacity:.75}
.note{background:var(--card-2);border-radius:16px;padding:10px 14px;margin:10px 0;font-size:1rem;color:var(--ink-soft);text-align:center}
.rsub h4{margin:8px 0 2px;font-size:1rem;color:var(--ink-soft)}
.rr small{color:var(--ink-soft);font-size:.75rem}
.wcard{background:var(--card-2);border-radius:22px;padding:14px;text-align:center}
.wcard h3{margin:0 0 8px;font-size:1.25rem}
.wrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.wrow .av2{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.wrow .btn{font-size:.85rem;padding:6px 12px}
.tie{display:inline-block;background:var(--yellow);color:#4a3200;border-radius:10px;padding:2px 8px;font-weight:700;font-size:.8rem}
.rvbox{padding:26px 14px}
.rvav{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:5.6rem;background:var(--card-2);box-shadow:inset 0 -10px 0 rgba(0,0,0,.15),0 10px 0 rgba(0,0,0,.12)}
.rvav.drum{animation:shake .45s infinite}
.rvname{font-size:2.1rem;font-weight:700;margin:6px 0}
@media print{
  body{background:#fff!important;animation:none!important}
  .corner,.edge,.credit,.mascot,.tools,.tiny,.bar,#confetti,#splash,.noprint{display:none!important}
  .card,.wcard{box-shadow:none!important;animation:none!important}
  .hero{color:#000!important;text-shadow:none!important}.rainbow{color:#2b1b6b!important;background:none!important}
}

/* popups */
.ov{position:fixed;inset:0;background:rgba(20,8,60,.62);backdrop-filter:blur(4px);z-index:150;display:grid;place-items:center;padding:18px;animation:fade .1s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pop-box{background:var(--card);color:var(--ink);border-radius:32px;padding:28px 24px;max-width:440px;width:100%;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.2),0 30px 60px rgba(0,0,0,.4);animation:pop .16s cubic-bezier(.2,1.5,.4,1)}
.pop-box .pi{font-size:4.4rem;line-height:1;animation:pulse 1.6s infinite}
.pop-box h3{font-size:1.7rem;margin:8px 0 6px}
.pop-box p{margin:0 0 16px;font-size:1.1rem;color:var(--ink-soft)}
.pop-box input{font:inherit;font-size:1.3rem;text-align:center;border:3px solid var(--purple);border-radius:16px;padding:10px;width:100%;margin-bottom:16px;background:var(--card-2);color:var(--ink)}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
</style>
</head>

      DATA[y][c]=shuffle(b.concat(g),r).map((fn,i)=>({id:`${y}${c}-${i+1}`,name:`${fn} ${f[i]}`,av:av[i],color:AV_COLORS[(i+ci)%AV_COLORS.length],cls:`${y}${c}`,sx:b.includes(fn)?"b":"g"}));
      return;
    }
    const roster=(ROSTER[y]&&ROSTER[y][c]&&ROSTER[y][c].length)?ROSTER[y][c]:[PLACEHOLDER];
    DATA[y][c]=roster.map((nm,i)=>{
      const av=AVATARS[(ci*4+i)%AVATARS.length],color=AV_COLORS[(ci*4+i)%AV_COLORS.length];
      let sx="n";

      return{id:`${y}${c}-${i+1}`,name:nm,av,color,cls:`${y}${c}`,sx};
    });
  });
});

/* ---------------- live candidates, added by the teacher, synced from the server ----------------
   These are kept OUT of the baked-in ROSTER (so no redeploy is needed) and merged into DATA/ALL
   on top of it. Every device pulls the same list from the sheet, so it's identical everywhere. */
function mergeCandidate_(c){
  const y=+c.year,cl=String(c.cls||"").toUpperCase();
  if(!DATA[y]||!DATA[y][cl]||!c.id||ALL[c.id])return;               // unknown class or already merged

}

async function deviceInfo(){

  if(/iPhone/.test(ua)){os="iOS "+((ua.match(/OS (\d+[_\d]*)/)||[])[1]||"").replace(/_/g,".");model="iPhone"}
  else if(/iPad/.test(ua)){os="iPadOS";model="iPad"}
  else if(/Android/.test(ua)){os="Android "+((ua.match(/Android ([\d.]+)/)||[])[1]||"");const m=ua.match(/Android [\d.]+;\s*([^;)]+?)(?:\sBuild|;|\))/);if(m)model=m[1].trim()}
  else if(/Windows/.test(ua))os="Windows";else if(/CrOS/.test(ua))os="ChromeOS";else if(/Mac OS X/.test(ua))os="macOS";else if(/Linux/.test(ua))os="Linux";
  if(/Edg\//.test(ua))browser="Edge";else if(/OPR\//.test(ua))browser="Opera";else if(/SamsungBrowser/.test(ua))browser="Samsung Browser";
  else if(/FxiOS|Firefox/.test(ua))browser="Firefox";else if(/CriOS|Chrome/.test(ua))browser="Chrome";else if(/Safari/.test(ua))browser="Safari";
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const v=await navigator.userAgentData.getHighEntropyValues(["model"]);if(v&&v.model)model=v.model}}catch(e){}
  const type=/iPad/.test(ua)||(/Android/.test(ua)&&!/Mobile/.test(ua))?"Tablet":(/Mobi|iPhone/.test(ua)?"Phone":"Computer");
  let screenTxt="";try{screenTxt=`${screen.width}x${screen.height} (${window.devicePixelRatio||1}x)`}catch(e){}
  return {type,model,os,browser,screen:screenTxt};
}

let serverMode=false;
async function api(action,body){

    let r;

      /* Google Apps Script: plain-text POST (no preflight), follows Google's redirect */
      r=await fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify({...(body||{}),action}),redirect:"follow",cache:"no-store",signal:ctl.signal});

    }

}

let AC=null,soundOn=true,musicOn=false,musicTimer=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d=.15,type="sine",when=0,vol=.18){
  if(!soundOn)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.05);
}

  whoosh(){tone(300,.25,"sawtooth",0,.06);tone(600,.2,"sine",.05,.08)},
  error(){tone(180,.2,"sawtooth",0,.14);tone(140,.3,"sawtooth",.15,.14)},
  boing(){tone(200,.25,"sine",0,.2);tone(400,.2,"sine",.08,.15)},
  drum(){for(let i=0;i<18;i++)tone(110+(i%2)*40,.09,"square",i*.09,.09+i*.004)},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.28,"triangle",i*.11,.2));tone(1568,.6,"sine",.6,.2)}
};

const cv=document.getElementById("confetti"),cx=cv.getContext("2d");let parts=[],raf=null;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(x,y,n=80){
  const cols=["#ffd23f","#ff4fa3","#19d3c5","#3a86ff","#8338ec","#ff7b2f","#2fd66b"];
  for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,g:.32,s:Math.random()*9+5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:130+Math.random()*60});
  if(!raf)loop();
}
function emojiPop(){
  const set=["🎉","🏆","⭐","🎈","🎊","🌟","🍩","🚀","🌈","💫","🎯","🎵","👏","🥳","🦁","🐼","✨","🎨","⚽","🗳️"];
  for(let i=0;i<34;i++){
    setTimeout(()=>{
      const e=document.createElement("div");e.className="emo";e.textContent=set[Math.floor(Math.random()*set.length)];
      e.style.left=(8+Math.random()*84)+"vw";e.style.top=(40+Math.random()*45)+"vh";
      e.style.fontSize=(28+Math.random()*44)+"px";
      e.style.setProperty("--dx",((Math.random()-.5)*160)+"px");e.style.setProperty("--dy",(-(150+Math.random()*320))+"px");
      e.style.setProperty("--rot",((Math.random()-.5)*70)+"deg");e.style.setProperty("--d",(2+Math.random()*1.4)+"s");
      document.body.appendChild(e);setTimeout(()=>e.remove(),1800);
    },i*70);
  }
}
function rain(){emojiPop();for(let i=0;i<8;i++)setTimeout(()=>burst(Math.random()*innerWidth,innerHeight*.15,60),i*90);burst(innerWidth/2,innerHeight*.6,140)}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.l>0&&p.y<cv.height+40);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.99;p.r+=p.vr;p.l--;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s/1.6);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):null;
}

async function submitVote(){

  else if(r===2)ctl=`<button class="btn green" id="hOpenVote" ${(HEAD.finalists.b.length&&HEAD.finalists.g.length)?"":"disabled"}>🗳️ Open student voting (Level 3)</button><button class="btn ghost noundo" id="hUndo" style="color:var(--ink);border-color:var(--ink-soft)">↩ Undo</button>`;
  else if(r===3)ctl=`<button class="btn green" id="hNext">✅ Close voting &amp; crown the winners 👑</button><button class="btn ghost noundo" id="hUndo" style="color:var(--ink);border-color:var(--ink-soft)">↩ Undo</button>`;
  else ctl=`<button class="btn green" id="hReveal">🎬 Reveal the winners!</button><button class="btn" id="hPrint">🖨 Print winners</button><button class="btn ghost" id="hUndo" style="color:var(--ink);border-color:var(--ink-soft)">↩ Reopen Level 3</button>`;
  const off=HEAD.enabled===false;
  const status=off?"🔌 Turned OFF — students cannot vote in it right now.":r===0?"Head election has not started.":r===2?"🎤 Interview stage — choose which nominees pass below.":r===4?"🏁 Finished — the winners are decided!":`🟢 Level ${r} is OPEN — <b>${cur}</b> ballots so far`;
  const offBtn=`<button class="btn ${off?"green":"red"}" id="hToggle">${off?"▶️ Turn Head election back ON":"🔌 Turn Head election OFF"}</button>`;
  const lv=[["1","🙋 Level 1 · Nominate"],["2","🎤 Level 2 · Interview"],["3","🗳️ Level 3 · Vote"],["4","👑 Winners"]];
  const tabs=lv.map(([k,t])=>`<button class="tab ${+k===hLevel?"on":""}" data-l="${k}">${t}${+k!==2&&bal[k]&&bal[k].total?`<i>${bal[k].total}</i>`:""}</button>`).join("");
  let body="";
  if(hLevel===1){
    body=arenaHTML("Year 10 &amp; 11 — all nominees, mixed",idsOf([...pool.b],"b"),idsOf([...pool.g],"g"),cnt(1),r>1?new Set([...HEAD.finalists.b,...HEAD.finalists.g]):null);
  }else if(hLevel===2){
    if(r<2){body=`<div class="note">Interview picks open once Level 1 (nominations) closes 🔒</div>`;}
    else{
      const c1=cnt(1);
      const row=(p)=>{const chosen=HEAD.finalists[p.sx].includes(p.id);
        return `<div class="rr"><span>${p.av} ${p.name} <small>${p.cls}</small></span><div><div class="meter" style="width:${Math.min(100,(c1[p.id]||0)*8)}%"></div></div><b>${c1[p.id]||0}</b><button class="btn ${chosen?"green":"ghost"} interview" style="padding:4px 10px;font-size:.85rem;margin-left:6px;${chosen?"":"color:var(--ink);border-color:var(--ink-soft)"}" data-sx="${p.sx}" data-id="${p.id}">${chosen?"✅ Passed":"Mark as finalist"}</button></div>`};
      const sorted=(sx)=>pool[sx].slice().sort((a,z)=>(c1[z.id]||0)-(c1[a.id]||0));
      body=`<div class="note">Tap "Mark as finalist" for whoever passed their interview — at least 1 boy &amp; 1 girl needed to open Level 3.</div>
      <div class="rgrid"><div class="rcls"><h3>👦 Boy nominees (sorted by nomination votes)</h3>${sorted("b").map(row).join("")}</div><div class="rcls"><h3>👧 Girl nominees (sorted by nomination votes)</h3>${sorted("g").map(row).join("")}</div></div>`;
    }
  }else if(hLevel===3){
    body=r<3?`<div class="note">Level 3 opens once the interview finalists are chosen 🔒</div>`:arenaHTML("Final vote — interview finalists",HEAD.finalists.b,HEAD.finalists.g,cnt(3),r>3?new Set([...HEAD.winners.b,...HEAD.winners.g]):null);
  }else{
    body=(r>=4?winnersHTML(true):`<div class="note">Winners appear here once Level 3 closes.</div>`)+(r===4?`<div class="note">If two students tie, press <b>👑 Crown</b> next to the one who should win.</div>`:"");
  }
  el.innerHTML=`<div class="live ${serverMode?"on":"off"}">${serverMode?"🟢 LIVE — all phones &amp; computers combined":"🟠 Demo mode — only votes saved on THIS device are shown"}</div>
  ${headStepper(r,true)}
  <div class="note" style="margin-top:14px">${status}</div>
  <div class="row" style="margin:8px 0 14px">${ctl}${offBtn}</div>
  <div class="tabs" id="hTabs">${tabs}</div>${body}`;
  el.querySelectorAll("#hTabs .tab").forEach(t=>t.onclick=()=>{sfx.click();hLevel=+t.dataset.l;paintHead()});
  el.querySelectorAll(".interview").forEach(bt=>bt.onclick=async()=>{
    sfx.click();const h=clone(HEAD),sx=bt.dataset.sx,id=bt.dataset.id,arr=h.finalists[sx];
    const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);
    try{await headSave(h);lastSig="";await refreshNow()}catch(e){sfx.error()}
  });
  el.querySelectorAll(".crown").forEach(bt=>bt.onclick=async()=>{
    const h=clone(HEAD);h.winners[bt.dataset.sx]=[bt.dataset.id];
    try{await headSave(h);sfx.win();burst(innerWidth/2,innerHeight/3,90);lastSig="";await refreshNow()}catch(e){sfx.error()}
  });
  const q=id=>document.getElementById(id);
  if(q("hStart"))q("hStart").onclick=async()=>{sfx.win();try{await headSave({round:1,enabled:HEAD.enabled,finalists:{b:[],g:[]},winners:{b:[],g:[]}});hLevel=1;lastSig="";await refreshNow()}catch(e){sfx.error()}};
  if(q("hToggle"))q("hToggle").onclick=async()=>{
    sfx.click();const h=clone(HEAD);h.enabled=!(h.enabled!==false);
    try{await headSave(h);lastSig="";await refreshNow()}catch(e){sfx.error()}
  };
  if(q("hOpenVote"))q("hOpenVote").onclick=()=>{
    sfx.boing();
    popup({icon:"🗳️",title:"Open Level 3 to the whole school?",text:`Finalists — 👦 ${HEAD.finalists.b.map(i=>ALL[i].name).join(", ")}<br>👧 ${HEAD.finalists.g.map(i=>ALL[i].name).join(", ")}`,buttons:[{label:"Cancel",cls:"red"},{label:"Yes, open it!",cls:"green",fn:async()=>{
      const h=clone(HEAD);h.round=3;try{await headSave(h);hLevel=3;lastSig="";sfx.win();await refreshNow()}catch(e){sfx.error()}
    }}]});
  };
  if(q("hNext"))q("hNext").onclick=headAdvance;
  if(q("hUndo"))q("hUndo").onclick=headUndo;
  if(q("hReveal"))q("hReveal").onclick=()=>{sfx.win();go(screenReveal)};
  if(q("hPrint"))q("hPrint").onclick=()=>{hLevel=4;paintHead();setTimeout(()=>window.print(),150)};
}
async function headAdvance(){
  try{const x=await fetchHeadResults();lastHead=x;if(x.head)HEAD=normHead(x.head)}catch(e){sfx.error();return}
  const r=HEAD.round;
  if(r===1){
    popup({icon:"🎤",title:"Close nominations & start Interview?",text:"Level 1 closes for good. You'll then pick which nominees pass their interview.",buttons:[{label:"Cancel",cls:"red"},{label:"Yes, go!",cls:"green",fn:async()=>{
      const h=clone(HEAD);h.round=2;try{await headSave(h);hLevel=2;lastSig="";sfx.win();await refreshNow()}catch(e){sfx.error()}
    }}]});
  }else if(r===3){
    const c=(lastHead.counts||{})[3]||{},notes=[];
    const top=(ids,label)=>{const m=Math.max(0,...ids.map(i=>c[i]||0)),t=ids.filter(i=>(c[i]||0)===m);
      if(m===0)notes.push(`No votes at all: ${label} → picking all finalists as co-winners`);else if(t.length>1)notes.push(`Tie: ${label} (${t.map(i=>ALL[i].name).join(", ")})`);return t};
    const h=clone(HEAD);h.winners={b:top(HEAD.finalists.b,"Head Boy"),g:top(HEAD.finalists.g,"Head Girl")};h.round=4;
    const shown=notes.map(n=>"• "+n).join("<br>");
    popup({icon:"👑",title:"Crown the winners?",text:`Level 3 will close and the Head Boy &amp; Head Girl are decided.${shown?`<br><br><small style="text-align:left;display:block">${shown}</small>`:""}`,buttons:[{label:"Cancel",cls:"red"},{label:"Yes, go!",cls:"green",fn:async()=>{
      try{await headSave(h);hLevel=4;lastSig="";sfx.win();rain();await refreshNow()}catch(e){sfx.error()}
    }}]});
  }
}
async function headUndo(){
  try{const x=await fetchHeadResults();lastHead=x;if(x.head)HEAD=normHead(x.head)}catch(e){sfx.error();return}
  const r=HEAD.round,bal=(lastHead.ballots||{}),n=(bal[r]&&bal[r].total)||0;
  if((r===1||r===3)&&n>0){sfx.error();popup({icon:"🚫",title:"Can't undo now",text:`Level ${r} already has ${n} ballots. Undo only works while a level has zero votes.`,buttons:[{label:"OK",cls:"green"}]});return}
  const h=clone(HEAD);
  if(r===1)h.round=0;
  else if(r===2)h.round=1;
  else if(r===3)h.round=2;
  else if(r===4)h.round=3;
  else return;
  const txt=r===4?"Level 3 opens again so people can vote.":r===2?"Interview closes and nominations (Level 1) reopen.":r===1?"The Head election goes back to 'not started'.":"Interview (Level 2) reopens.";
  popup({icon:"↩",title:"Go back one step?",text:txt,buttons:[{label:"Cancel",cls:"red"},{label:"Yes, undo",cls:"green",fn:async()=>{try{await headSave(h);hLevel=Math.max(1,h.round);lastSig="";await refreshNow()}catch(e){sfx.error()}}}]});
}
function headCsv(d){
  const c=d.counts||{},pool=headPoolAll(),rows=[["Level","Boy/Girl","Candidate","Class","Nomination Votes","Interview Finalist","Final Votes","Winner"]];
  [...pool.b,...pool.g].forEach(p=>{
    const fin=HEAD.finalists[p.sx].includes(p.id)?"Yes":"";
    const win=HEAD.winners[p.sx].includes(p.id)?"Yes":"";
    rows.push([1,p.sx==="b"?"Boy":"Girl",p.name,p.cls,(c[1]||{})[p.id]||0,fin,(c[3]||{})[p.id]||0,win]);
  });
  return rows.map(r=>r.join(",")).join("\n");
}
/* ---------------- winners reveal ceremony ---------------- */
function screenReveal(){
  const w=HEAD.winners||{b:[],g:[]};
  const list=[];if(w.g.length)list.push({sx:"g",ids:w.g});if(w.b.length)list.push({sx:"b",ids:w.b});
  let i=0;
  app.innerHTML=`${hero("👑 Head Boy &amp; Head Girl — Winners")}<div class="card center rvbox" id="rv"></div>`;
  const box=document.getElementById("rv");
  const board=()=>{
    box.innerHTML=`<h2 style="margin-top:0">🎉 Congratulations to our winners! 🎉</h2>${winnersHTML(false)}
    <div class="row noprint" style="margin-top:18px"><button class="btn" id="bk">⬅ Back to results</button><button class="btn green" id="pr">🖨 Print</button><button class="btn red" id="again">🎬 Replay</button></div>`;
    rain();
    document.getElementById("bk").onclick=()=>{sfx.click();go(screenResults)};
    document.getElementById("pr").onclick=()=>window.print();
    document.getElementById("again").onclick=()=>{i=0;step()};
  };
  const step=()=>{
    if(i>=list.length){board();return}
    const it=list[i],title=it.sx==="g"?"👧 Head Girl":"👦 Head Boy";
    box.innerHTML=`<div style="opacity:.75">Reveal ${i+1} of ${list.length}</div><h2 style="margin:6px 0">${title}</h2><div class="rvav" id="av">❓</div><div class="rvname" id="nm">And the winner is…</div><div class="row" style="margin-top:14px"><button class="btn green" id="go" style="font-size:1.4rem;padding:16px 30px">🥁 Reveal!</button></div>`;
    document.getElementById("go").onclick=()=>{
      const bt=document.getElementById("go");bt.disabled=true;sfx.drum();
      const av=document.getElementById("av");av.classList.add("drum");
      setTimeout(()=>{
        av.classList.remove("drum");
        const ps=it.ids.map(x=>ALL[x]);
        av.style.background=ps[0].color;av.textContent=ps.length>1?"🤝":ps[0].av;
        document.getElementById("nm").innerHTML=ps.map(p=>`${p.av} ${p.name} <small style="font-size:1rem;color:var(--ink-soft)">(${p.cls})</small>`).join("<br>");
        sfx.win();rain();
        bt.disabled=false;bt.textContent=i===list.length-1?"🏁 Finish":"Next ➡️";bt.onclick=()=>{sfx.click();i++;step()};
      },1900);
    };
  };
  if(!list.length){board();return}
  step();
}

/* ---------------- Candidates : teacher admin (add / remove, synced live to every device) ---------------- */
const CINPUT="font:inherit;font-size:1.05rem;border:3px solid var(--purple);border-radius:16px;padding:10px 14px;background:var(--card-2);color:var(--ink)";
let candYear=4,candCls="A",candList=[];
async function refreshCandAdmin(){
  try{const j=await api("candidates_list",{password:resPass});candList=(j&&j.ok&&j.candidates)||[]}catch(e){}
  paintCandAdmin();
}
function paintCandAdmin(){
  const el=document.getElementById("candsPane");if(!el)return;
  const isHeadYr=candYear===10||candYear===11;
  const dynIds=new Set(candList.filter(c=>+c.year===candYear&&c.cls===candCls).map(c=>c.id));
  const built=((DATA[candYear]&&DATA[candYear][candCls])||[]).filter(p=>!dynIds.has(p.id));
  const dyn=candList.filter(c=>+c.year===candYear&&c.cls===candCls);
  const yTabs=ALL_YEARS.map(y=>`<button class="tab ${y===candYear?"on":""}" data-y="${y}">Year ${y}</button>`).join("");
  const cTabs=CLASSES.map(c=>`<button class="tab ${c===candCls?"on":""}" data-c="${c}">${candYear}${c}</button>`).join("");
  const rowsHtml=built.map(p=>`<div class="rr"><span>${p.av} ${p.name}</span><span></span><small style="text-align:right">built-in</small></div>`).join("")
    +dyn.map(c=>`<div class="rr"><span>${c.name}${isHeadYr?` <small>(${c.sex==="g"?"Head Girl":"Head Boy"})</small>`:""}</span><span></span><button class="btn red" style="padding:4px 10px;font-size:.8rem" data-rm="${c.id}">✕ Remove</button></div>`).join("");
  el.innerHTML=`<div class="note">Add a candidate here and it shows up on every phone &amp; computer within a few seconds — no redeploy needed.</div>
  <div class="tabs">${yTabs}</div><div class="tabs">${cTabs}</div>
  <div class="rcls" style="margin-bottom:14px"><h3>Class ${candYear}${candCls}</h3>${rowsHtml||"<small>No candidates yet — add one below.</small>"}</div>
  <div class="row">
    <input id="candName" type="text" placeholder="Candidate full name" style="${CINPUT};flex:1;min-width:200px" autocomplete="off">
    ${isHeadYr?`<select id="candSex" style="${CINPUT}"><option value="b">👦 Head Boy candidate</option><option value="g">👧 Head Girl candidate</option></select>`:""}
    <button class="btn green" id="candAdd">➕ Add candidate</button>
  </div>`;
  el.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{sfx.click();candYear=+b.dataset.y;paintCandAdmin()});
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{sfx.click();candCls=b.dataset.c;paintCandAdmin()});
  el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>removeCandidate(b.dataset.rm));
  const nameEl=document.getElementById("candName");
  const doAdd=()=>addCandidate();
  const addBtn=document.getElementById("candAdd");if(addBtn)addBtn.onclick=doAdd;
  if(nameEl)nameEl.addEventListener("keydown",e=>{if(e.key==="Enter")doAdd()});
}
async function addCandidate(){
  const nameEl=document.getElementById("candName"),name=(nameEl&&nameEl.value||"").trim();
  if(!name){sfx.error();popup({icon:"🤔",title:"Name needed",text:"Type the candidate's full name first.",buttons:[{label:"OK",cls:"green"}]});return}
  const sexEl=document.getElementById("candSex"),sex=sexEl?sexEl.value:undefined;
  try{
    const j=await api("candidate_add",{password:resPass,year:candYear,cls:candCls,name,sex});
    if(!j||!j.ok){sfx.error();popup({icon:"😕",title:"Could not add",text:"Something went wrong — try again.",buttons:[{label:"OK",cls:"green"}]});return}
    sfx.win();mergeCandidate_(j);await refreshCandAdmin();
  }catch(e){sfx.error()}
}
async function removeCandidate(id){
  sfx.click();
  popup({icon:"⚠️",title:"Remove this candidate?",text:"They'll no longer appear on the ballot. Votes already cast for them stay counted in the results.",buttons:[{label:"Cancel",cls:"green"},{label:"Remove",cls:"red",fn:async()=>{
    try{await api("candidate_remove",{password:resPass,id})}catch(e){}
    await refreshCandAdmin();
  }}]});
}

function screenResults(){
  app.innerHTML=`${hero("📊 Election results")}<div class="card">
  <div class="tabs" id="mainTabs"><button class="tab" data-t="council">🗳️ Student Council</button><button class="tab" data-t="head">👑 Head Boy &amp; Girl</button><button class="tab" data-t="cands">🧑‍🎓 Candidates</button></div>
  <div id="councilPane"><div id="resTop"></div><div class="tabs" id="ryTabs"></div><div id="resBody"></div></div>
  <div id="headPane" style="display:none"></div>
  <div id="candsPane" style="display:none"></div>
  <div class="row" style="margin-top:18px" id="resActions"><button class="btn" id="back">⬅ Back</button><button class="btn green" id="csv">⬇ Save CSV</button><button class="btn red" id="reset">🗑 Reset</button></div></div>`;
  const setTab=()=>{
    document.querySelectorAll("#mainTabs .tab").forEach(t=>t.classList.toggle("on",t.dataset.t===resTab));
    document.getElementById("councilPane").style.display=resTab==="council"?"":"none";
    document.getElementById("headPane").style.display=resTab==="head"?"":"none";
    document.getElementById("candsPane").style.display=resTab==="cands"?"":"none";
    document.getElementById("csv").style.display=resTab==="cands"?"none":"";
    document.getElementById("reset").style.display=resTab==="cands"?"none":"";
    if(resTab!=="cands")document.getElementById("reset").textContent=resTab==="council"?"🗑 Reset council votes":"🗑 Reset Head election";
  };
  const refresh=async()=>{try{
    if(resTab==="council"){lastRes=await fetchResults();paintResults()}
    else if(resTab==="head"){const x=await fetchHeadResults(),sig=JSON.stringify(x);if(x.head)HEAD=normHead(x.head);if(sig!==lastSig){lastSig=sig;lastHead=x;paintHead()}}
  }catch(e){}};
  window.refreshNow=async()=>{lastSig="";await refresh()};
  setTab();
  document.querySelectorAll("#mainTabs .tab").forEach(t=>t.onclick=()=>{sfx.click();resTab=t.dataset.t;lastSig="";setTab();if(resTab==="head"&&lastHead)paintHead();if(resTab==="cands")refreshCandAdmin();else refresh()});
  if(resTab==="council"&&lastRes)paintResults();
  if(resTab==="head"&&lastHead){if(HEAD.round>0)hLevel=Math.min(HEAD.round,4);paintHead()}
  if(resTab==="cands")refreshCandAdmin();else refresh();
  if(serverMode)resTimer=setInterval(()=>{if(resTab!=="cands")refresh()},2000);
  document.getElementById("back").onclick=()=>{sfx.click();resPass=null;go(screenHome)};
  document.getElementById("csv").onclick=()=>{
    sfx.click();const isH=resTab==="head",d=isH?lastHead:lastRes;if(!d)return;
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+(isH?headCsv(d):csvOf(d))],{type:"text/csv"}));a.download=isH?"ethos-head-results.csv":"ethos-vote-results.csv";document.body.appendChild(a);a.click();a.remove()}catch(e){}
  };
  document.getElementById("reset").onclick=()=>{
    sfx.error();
    const isH=resTab==="head";
    popup({icon:"⚠️",title:isH?"Reset the Head election?":"Reset council votes?",
      text:isH?(serverMode?"This deletes ALL Head Boy / Head Girl votes, the finalists, and unlocks ALL phones for it. Only do this before the real election!":"This deletes the Head election votes and progress saved on THIS browser."):(serverMode?"This deletes ALL Student Council votes and unlocks ALL phones for it. Only do this before the real election!":"This deletes all council votes and the vote lock stored on THIS browser."),
      buttons:[{label:"Cancel",cls:"green"},{label:"Yes, reset",cls:"red",fn:async()=>{
      try{
        if(isH){
          if(serverMode)await api("head_reset",{password:resPass});
          [K_HEAD,K_HVOTES,K_HBAL,lk("head1"),lk("head2"),lk("head3")].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});
          ["head1","head2","head3"].forEach(sc=>{document.cookie=lk(sc)+"=;max-age=0;path=/";idbSet(lk(sc),0)});
          HEAD=emptyHead();hLevel=1;lastSig="";lastHead=null;
        }else{
          if(serverMode)await api("reset",{password:resPass});
          try{localStorage.removeItem(K_VOTES);localStorage.removeItem(K_BALLOTS);localStorage.removeItem(K_LOCK);localStorage.removeItem(K_TOK)}catch(e){}
          document.cookie=K_LOCK+"=;max-age=0;path=/";await idbSet(K_LOCK,0);await idbSet(K_TOK,null);
        }
        await refresh();
      }catch(e){}
    }}]});
  };
}

/* =====================================================================
   BOOT – splash line, then the app
   ===================================================================== */
addEventListener("pageshow",e=>{if(e.persisted&&(state.mode==="phone"||qrEntry)){state.mode="phone";go(screenElection)}});
(async function boot(){
  const minWait=new Promise(r=>setTimeout(r,700));
  await detectServer();
  await loadCandidates();
  await minWait;
  const sp=document.getElementById("splash");sp.classList.add("out");setTimeout(()=>sp.remove(),260);
  if(qrEntry){state.mode="phone";go(screenElection);return}
  go(screenHome);
})();
</script>
